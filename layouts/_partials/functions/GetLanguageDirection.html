{{ $dir := "" }}
{{ if and (ge hugo.Version "0.67.1") (lt hugo.Version "0.155.0") }}
  {{ with  site.Language.LanguageDirection }}
     {{ $dir = . }}
  {{ end }}
{{ else if ge hugo.Version "0.155.0" }}
  {{ with  site.Language.Direction }}
     {{ $dir = . }}
  {{ end }}
{{ end }}
{{ return $dir }}
